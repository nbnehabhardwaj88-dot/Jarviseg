d('listening'); const command = lower.replace(/hey jarvis|jarvis/g, "").trim(); if (!command) { statusText.innerText = "Listening..."; speak("Yes, Sir?"); return; } logText.innerHTML = `<strong>You:</strong> ${transcript}`; statusText.innerText = "Processing..."; const reply = await processCommand(command); reactor.classList.remove('listening'); logText.innerHTML += `<br><br><strong>JARVIS:</strong> ${reply}`; speak(reply); } }; recognition.onend = () => { // Automatically restart listening for wake-word if system is active if (isRunning && !isSpeaking) { try { recognition.start(); } catch (e) {} } }; async function processCommand(cmd) { // Offline Built-in Commands if (cmd.includes("time")) { return `It is currently ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}, Sir.`; } if (cmd.includes("date") || cmd.includes("day")) { return `Today is ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}, Sir.`; } if (cmd.includes("open youtube")) { window.open("https://youtube.com", "_blank"); return "Opening YouTube now, Sir."; } if (cmd.includes("search for")) { const query = cmd.split("search for")[1].trim(); window.open(`https://google.com{encodeURIComponent(query)}`, "_blank"); return `Searching Google for ${query}, Sir.`; } // Gemini AI Brain (if key is provided) if (GEMINI_API_KEY) { try { const url = `https://googleapis.com{GEMINI_API_KEY}`; const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ systemInstruction: { parts: [{ text: "You are JARVIS, a polite, witty, and concise AI butler. Address the user as Sir. Respond in 1 to 2 short sentences without markdown symbols." }] }, contents: [{ parts: [{ text: cmd }] }] }) }); const data = await response.json(); return data.candidates[0].content.parts[0].text; } catch (err) { return "I encountered a network error reaching the Gemini mainframe, Sir."; } } return "I heard you, Sir, though my cloud AI is disconnected. Paste a Gemini API key below for full conversation."; } function speak(text) { isSpeaking = true; recognition.stop(); // Pause mic so Jarvis doesn't hear himself reactor.classList.add('speaking'); statusText.innerText = "Speaking..."; const utterance = new SpeechSynthesisUtterance(text); const voices = window.speechSynthesis.getVoices(); const britishVoice = voices.find(v => v.lang.includes('en-GB') && v.name.includes('Male')) || voices.find(v => v.lang.includes('en-GB')); if (britishVoice) utterance.voice = britishVoice; utterance.pitch = 0.95; utterance.rate = 1.05; utterance.onend = () => { isSpeaking = false; reactor.classList.remove('speaking'); if (isRunning) { statusText.innerText = "Standby (Say 'Hey Jarvis')"; try { recognition.start(); } catch (e) {} } }; window.speechSynthesis.speak(utterance); } // Pre-load voices window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); </script> </body> </html>
